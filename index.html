<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🏆 Cazador de Llamas - Fortnite Edition</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <link rel="icon" href="assets/icon/pavos.png">
</head>
<body class="fortnite-theme d-flex flex-column min-vh-100">
    
    <header class="header-fortnite text-white text-center p-3 shadow-lg">
        <h1 class="display-5 fw-bold">🏆 CAZADOR DE LLAMAS</h1>
        <img src="assets/img/fortnite.png" alt="Battle Bus" width="140" class="img-fluid mt-2 drop-shadow">
    </header>

    <main class="container text-center mt-4 flex-grow-1">
        <div class="alert alert-fortnite py-2 mx-auto shadow-sm mb-4">
            <strong>MISIÓN:</strong> ¡Haz clic en las llamas para recolectar botín! Cuidado con los rebotes.
        </div>
        
        <h3 class="mb-3 text-white">Botín Recolectado: <span id="contador" class="badge bg-warning text-dark shadow">0</span></h3>
        
        <div class="canvas-container d-flex justify-content-center pb-4">
            <canvas id="gameCanvas" width="800" height="500"></canvas>
        </div>
    </main>

    <footer class="footer-fortnite text-white text-center p-3">
        <p class="mb-0">
            <strong>EQUIPO DE DESARROLLO:</strong><br>
            Alan Alessandro Gonzalez Arroyo (23201260) | Jose Luis Gomez Cruz (23200841)<br>
            <small class="text-info">Ingeniería en Sistemas Computacionales - Tec Pachuca</small>
        </p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
